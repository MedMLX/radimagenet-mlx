[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "radimagenet-mlx"
version = "0.3.3"
description = "Extract radiology-image features with native MLX RadImageNet encoders"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Joseph Sandoval" },
  { name = "Alfredo Sandoval Jr." },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "mlx",
  "apple-silicon",
  "metal",
  "medical-imaging",
  "radimagenet",
  "radiology",
  "feature-extraction",
  "resnet",
  "densenet",
  "inception",
]
dependencies = [
  "medmlx-core==0.2.6",
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "numpy>=2.0,<3",
  "pillow>=13,<14",
]

[project.entry-points."medmlx.models"]
radimagenet-resnet50 = "radimagenet_mlx.medmlx:RESNET50"
radimagenet-densenet121 = "radimagenet_mlx.medmlx:DENSENET121"
radimagenet-inceptionv3 = "radimagenet_mlx.medmlx:INCEPTIONV3"
radimagenet-inceptionresnetv2 = "radimagenet_mlx.medmlx:INCEPTIONRESNETV2"

[project.urls]
Homepage = "https://medmlx.org"
Documentation = "https://github.com/MedMLX/radimagenet-mlx/blob/v0.3.3/README.md"
Repository = "https://github.com/MedMLX/radimagenet-mlx"
Issues = "https://github.com/MedMLX/radimagenet-mlx/issues"
Weights = "https://huggingface.co/MedMLX/radimagenet-mlx"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.optional-dependencies]
reference = [
  "tensorflow==2.20.0",
  "keras==3.15.0",
]
dev = [
  "pyright==1.1.414",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", ]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/radimagenet_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["metal: requires MLX on Metal on macOS arm64"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Use a precise type at the boundary." }
"typing_extensions.Any" = { msg = "Use a precise type at the boundary." }

[tool.hatch.build.targets.sdist]
only-include = [
  "src/radimagenet_mlx",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
